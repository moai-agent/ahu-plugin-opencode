[package]
name = "ahu-plugin-opencode"
version = "0.1.1"
edition = "2024"
publish = false
license = "MIT"
description = "External opencode harness runtime for ahu"

[workspace]
members = ["crates/runtime", "crates/native", "crates/events", "vendor/ahu-harness-api"]

[dependencies]
sha2 = "0.10"
libc = "0.2"
ahu-harness-runtime = { path = "crates/runtime" }

[dev-dependencies]
serde_json = "1"
