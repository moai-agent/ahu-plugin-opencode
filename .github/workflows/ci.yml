name: Rust
on:
  push:
    branches: [main, 'release/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.ahu/build/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - name: Prepare repository-local private storage
        run: |
          umask 077
          mkdir -p .ahu/build .ahu/packages
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --no-default-features --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: |
          umask 077
          mkdir -p .ahu/packages
          cargo run --locked --bin package -- "$PWD/.ahu/packages/ci"
      - name: Check out pinned core conformance consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: moai-agent/ahu
          ref: 6731ebf4dddccb9f9b4eaaed46a84e4a3cac2956
          path: .ahu/conformance/core
          persist-credentials: false
      - name: Exercise the declared core compatibility
        run: scripts/check-core-conformance.sh "$PWD/.ahu/conformance/core" "$PWD/.ahu/packages/ci/harness-opencode"
